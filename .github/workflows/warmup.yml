name: Warmup GAS & Vercel

on:
  schedule:
    # 每 10 分鐘執行一次，卡在 GAS 15 分鐘休眠臨界點前
    - cron: "*/10 * * * *"
  workflow_dispatch: # 支援在 GitHub 網頁介面手動觸發測試

jobs:
  warmup:
    name: Ping Warmup Route
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Ping Warmup Endpoint
        run: |
          for i in {1..2}; do
            echo "Attempt $i: Pinging warmup endpoint..."
            HTTP_STATUS=$(curl -s --max-time 35 -o /tmp/warmup_res.json -w "%{http_code}" https://ntust-robotresearchers.vercel.app/api/cron/warmup)
            echo "HTTP Status: $HTTP_STATUS"
            cat /tmp/warmup_res.json || true
            echo ""
            if [ "$HTTP_STATUS" -eq 200 ]; then
              echo "Warmup succeeded on attempt $i."
              exit 0
            fi
            echo "Attempt $i failed with status $HTTP_STATUS. Retrying in 3 seconds..."
            sleep 3
          done
          echo "Warmup failed after 2 attempts."
          exit 1
