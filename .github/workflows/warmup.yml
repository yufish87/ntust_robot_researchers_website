name: Warmup GAS & Vercel

on:
  schedule:
    # 每 10 分鐘執行一次，卡在 GAS 15 分鐘休眠臨界點前
    - cron: "*/10 * * * *"
  workflow_dispatch: # 支援在 GitHub 網頁介面手動觸發測試

jobs:
  warmup:
    name: Ping Warmup Route
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Ping Warmup Endpoint
        run: |
          HTTP_STATUS=$(curl -s -o /tmp/warmup_res.json -w "%{http_code}" https://ntust-robotresearchers.vercel.app/api/cron/warmup)
          echo "HTTP Status: $HTTP_STATUS"
          cat /tmp/warmup_res.json || true
          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "Warmup ping returned status $HTTP_STATUS"
            exit 1
          fi
